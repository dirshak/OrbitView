# Run OrbitView entirely from Docker Hub images (no source code or build needed).
#
#   set DOCKERHUB_USER=<username>          (PowerShell: $env:DOCKERHUB_USER="<username>")
#   docker compose -f deploy/dockerhub/docker-compose.hub.yml -p orbitview-hub up -d
#   open http://localhost:8081
#
# Uses different host ports from the development stack so both can run side by side.
# GROQ_API_KEY is optional (the assistant shows a setup hint without it).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astrotrack
      POSTGRES_PASSWORD: astrotrack
      POSTGRES_DB: astrotrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrotrack"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER}/orbitview-backend:${ORBITVIEW_VERSION:-1.0.1}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=astrotrack;Username=astrotrack;Password=astrotrack
      AstroTrack__Cors__AllowedOrigins__0: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5180:8080"

  ml-service:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER}/orbitview-ml-service:${ORBITVIEW_VERSION:-1.0.1}
    environment:
      BACKEND_URL: http://backend:8080
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OMP_NUM_THREADS: "1"
    depends_on:
      - backend
    ports:
      - "5190:8000"

  frontend:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER}/orbitview-frontend:${ORBITVIEW_VERSION:-1.0.1}
    depends_on:
      - backend
      - ml-service
    ports:
      - "8081:80"
